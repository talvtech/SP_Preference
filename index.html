<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>SP喜好小瓶子</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="shell">
      <header class="page-heading"><h1>SP喜好小瓶子</h1></header>
      <main id="categories" aria-label="喜好分类"></main>
      <footer class="page-footer">
        关注"他律app"公众号，获取更多圈内有趣玩法
      </footer>
    </div>
    <div class="dock">
      <div class="dock-inner">
        <div class="dock-actions">
          <button class="button secondary" id="resetButton" type="button">
            清空填写</button
          ><button class="button primary" id="exportButton" type="button">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              aria-hidden="true"
            >
              <path d="M12 3v12m-4-4 4 4 4-4M4 15v5h16v-5" /></svg
            >保存图片
          </button>
        </div>
      </div>
    </div>
    <dialog class="ios-dialog" id="addDialog" aria-labelledby="addHeading">
      <form id="addForm" novalidate>
        <div class="ios-dialog-body">
          <h2 id="addHeading">添加瓶子</h2>
          <label class="ios-field-label" for="bottleInput">瓶子名称</label>
          <div class="ios-input-wrap">
            <input
              id="bottleInput"
              type="text"
              autocomplete="off"
              placeholder="瓶子名称"
              aria-describedby="nameError nameHelp"
            />
            <div class="input-helper" id="nameHelp">
              <span>最多 12 个字符</span><span id="nameCount">0 / 12</span>
            </div>
            <div id="nameError" class="field-error" role="alert"></div>
          </div>
        </div>
        <div class="dialog-actions ios-actions">
          <button class="button secondary" id="cancelAdd" type="button">
            取消</button
          ><button class="button primary" type="submit">添加</button>
        </div>
      </form>
    </dialog>
    <dialog
      class="ios-dialog"
      id="confirmDialog"
      aria-labelledby="confirmHeading"
      aria-describedby="confirmText"
    >
      <div class="ios-dialog-body">
        <h2 id="confirmHeading">确认清空</h2>
        <p id="confirmText"></p>
      </div>
      <div class="dialog-actions ios-actions">
        <button class="button secondary" id="cancelConfirm" type="button">
          取消</button
        ><button class="button danger" id="acceptConfirm" type="button">
          确认
        </button>
      </div>
    </dialog>
    <dialog
      class="image-save-dialog"
      id="imageSaveDialog"
      aria-labelledby="imageSaveHeading"
      aria-describedby="imageSaveHint"
    >
      <div class="image-save-heading">
        <h2 id="imageSaveHeading">保存图片</h2>
        <button
          class="image-save-close"
          id="closeImageSave"
          type="button"
          aria-label="关闭"
        >
          ×
        </button>
      </div>
      <img id="saveImage" alt="已生成的喜好小瓶子图片，可长按保存" />
      <p id="imageSaveHint" role="status"></p>
    </dialog>
    <div class="toast" id="toast" role="status" hidden></div>
    <noscript
      ><p style="padding: 24px; text-align: center">
        请使用启用 JavaScript 的浏览器打开这个 HTML 文件。
      </p></noscript
    >
    <script src="./script.js"></script>
  </body>
</html>
