<script>
'use strict';
(() => {
const CATALOG = [
 {id:'degree',name:'程度',items:['轻度（拍灰）','轻中度（发肿）','中度（硬块）','中重度（淤紫）','重度（破皮）']},

 {id:'body',name:'部位',items:['臀部','臀缝','大腿（后侧）','大腿（前侧）','小腿','手心','脚心','背部','面部']},
 {id:'tool',name:'工具',items:['巴掌','戒尺','皮具','藤条','板子','橡胶类','亚克力类','发刷','散鞭','长鞭','马鞭','数据线','跳绳（贼疼）']},
 {id:'position',name:'姿势',items:['OTK','平趴','跪趴','趴桌子','站立扶墙','站立扶腿','尿布式']},
 {id:'feeling',name:'氛围',items:['仪式感','羞耻感','压迫感','安全感','控制感','不安感','服从感']},
 {id:'extra',name:'附加',items:['罚站','罚跪','写检讨','罚抄写','姜罚','晾臀']},
 {id:'other',name:'其他',items:['aftercare','请罚','多人实践','责罚期','正装','cosplay','回锅','实践日记','喜欢余痛']}
];
CATALOG.forEach(c => c.items = c.items.map((name,i) => ({id:c.id+'-'+String(i+1).padStart(2,'0'),name})));
// Append a stable ID while inserting the new tool in its requested display position.
CATALOG.find(c=>c.id==='tool').items.splice(4,0,{id:'tool-14',name:'小红'});
// Keep existing item IDs so merging categories preserves saved preferences.
const extraIndex=CATALOG.findIndex(c=>c.id==='extra');
const otherCategory=CATALOG.find(c=>c.id==='other');
otherCategory.items=[...CATALOG[extraIndex].items,...otherCategory.items];
CATALOG.splice(extraIndex,1);
const STATES = ['empty','low','medium','high','full','reject'];
const STATE_NAMES = {empty:'空',low:'低',medium:'中',high:'高',full:'满',reject:'拒绝'};
const STORAGE_KEY = 'preference-bottles:mvp:1';
const BODY_PATH = 'M33 23 L67 23 L67 35 C67 40 83 43 83 58 L83 126 Q83 139 70 139 L30 139 Q17 139 17 126 L17 58 C17 43 33 40 33 35 Z';
const OPEN_BODY_PATH = BODY_PATH.replace('M33 23 L67 23','M67 23').replace(/ Z$/,' L33 23');
const OVERFLOW_CLIP_PATH = BODY_PATH+' M33 0 H67 V24 H33 Z';
const NECK_FILL = 'rgba(233,245,245,.8)';
const NECK_PATH = 'M33 23 L33 34 Q50 38 67 34 L67 23 Z';
const LINE_PATH = 'M25 58 L25 112 M25 120 L25 124';
const CROSS_PATH = 'M36 73 L64 105 M64 73 L36 105';
// Irregular piles: each level has a different surface rather than four-star rows.
const FULL_STAR_PILE = [
 [31,129,12.2,-17],[55,130,12.8,27],[74,120,11.4,-10],
 [27,109,12.3,35],[62,104,13.1,8],
 [39,87,13.1,18],[73,82,12.5,29],
 [23,70,10.8,-22],[66,62,12.5,-4],[42,63,12.8,32],
 [39,45,11.4,-14],[60,36,11.2,16],[42,22,9.8,-5],[59,22,9.4,8]
];
const STAR_PILES = {
 empty:[],reject:[],
 low:[[28,129,11.9,-19],[50,130,12.1,25],[72,128,11.8,-8],[43,112,12.5,32]],
 medium:[[29,129,12.1,-17],[52,130,12.5,27],[73,123,11.7,-10],[23,109,11.4,35],[45,109,12.8,-31],[66,104,12.3,8],[34,91,12,18]],
 high:FULL_STAR_PILE.slice(0,10),full:FULL_STAR_PILE
};
function starsFor(state,seed){
 let hash=2166136261;for(const char of String(seed)){hash=Math.imul(hash^char.codePointAt(0),16777619)>>>0;}
 function random(){hash=(Math.imul(hash,1664525)+1013904223)>>>0;return hash/4294967296;}
 return STAR_PILES[state].map(([x,y,r,angle],index)=>({x:x+(random()-.5)*2,y:y+(random()-.5)*2,r:r*(.95+random()*.08),angle:angle+(random()-.5)*36,shade:(index+Math.floor(random()*4))%4}));
}
const STAR_COLORS = ['#e4bd61','#eed08b','#d8ab4f','#ebcb7d'];

const BURST_STARS = [

 {x:65,y:12,r:11.2,angle:28,shade:0},{x:83,y:29,r:11.4,angle:-12,shade:2}

const BURST_DOTS = [[6,6,1.2],[28,37,1],[84,4,1],[96,16,1.4],[87,46,1.1]];
const BURST_LINES = [[8,32,4,28],[49,8,50,3],[80,12,85,7],[94,36,98,39]];
function burstSVG(){
 return '<g class="star-burst">'+BURST_STARS.map(s=>'<polygon points="'+starPoints(s)+'" fill="'+STAR_COLORS[s.shade]+'" stroke="#b18c40" stroke-width=".45" stroke-linejoin="round"/>').join('')+BURST_DOTS.map(([x,y,r])=>'<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="#dbb86e"/>').join('')+BURST_LINES.map(([x1,y1,x2,y2])=>'<path d="M'+x1+' '+y1+'L'+x2+' '+y2+'" fill="none" stroke="#dbb86e" stroke-width="1.2" stroke-linecap="round"/>').join('')+'</g>';
}
function drawBurst(ctx){
 BURST_STARS.forEach(s=>{const points=starPoints(s).split(' ').map(p=>p.split(',').map(Number));ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.lineJoin='round';ctx.fillStyle=STAR_COLORS[s.shade];ctx.strokeStyle='#b18c40';ctx.lineWidth=.45;ctx.fill();ctx.stroke();});
 ctx.fillStyle='#dbb86e';BURST_DOTS.forEach(([x,y,r])=>{ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();});

$('exportButton').addEventListener('click',async()=>{
 if(exporting)return;
 exporting=true;const button=$('exportButton'),label=button.innerHTML;
 button.disabled=true;button.setAttribute('aria-busy','true');button.textContent='正在生成…';let snapshot;
 try{
  // Freeze the page at the click, while allowing normal editing to continue.
  snapshot=createExportSnapshot();
  await new Promise(resolve=>requestAnimationFrame(()=>setTimeout(resolve,30)));await document.fonts.ready;
  const canvas=makeExportCanvas(snapshot);snapshot.remove();snapshot=null;
  let blob;try{blob=await new Promise((resolve,reject)=>canvas.toBlob(value=>value?resolve(value):reject(new Error('PNG generation failed')),'image/png'));}finally{canvas.width=1;canvas.height=1;}
  const url=URL.createObjectURL(blob),anchor=document.createElement('a');
  anchor.href=url;anchor.download='喜好小瓶子.png';document.body.append(anchor);
  try{anchor.click();}finally{anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
  toast('下载已发起');
 }catch{toast('图片生成失败，请重试');}
 finally{if(snapshot)snapshot.remove();exporting=false;button.disabled=false;button.removeAttribute('aria-busy');button.innerHTML=label;}
});
render();if(migrated)toast('程度已改为范围选择，请重新选择；其他填写已保留。');
})();
</script>
</body>
